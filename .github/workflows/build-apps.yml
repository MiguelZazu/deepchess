name: Build apps

# Push a tag (git tag v0.1.0 && git push origin v0.1.0) → builds the APK and the Windows
# installers and attaches them to a GitHub Release. The APK is signed with the key stored in the
# repository secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and
# ANDROID_KEY_PASSWORD (Settings → Secrets and variables → Actions).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # The runner image already ships the Android SDK (ANDROID_HOME); Gradle fetches anything missing.
      - run: npm ci
      # Default move sounds: third-party licence, so they live in repository secrets instead of
      # the public repo. Without the secrets the build simply uses the other sound packs.
      - name: Restore private sounds
        shell: bash
        env:
          MOVE_B64: ${{ secrets.SOUND_FOLEY_MOVE_B64 }}
          CAPTURE_B64: ${{ secrets.SOUND_FOLEY_CAPTURE_B64 }}
        run: |
          if [ -n "$MOVE_B64" ] && [ -n "$CAPTURE_B64" ]; then
            mkdir -p public/sounds/foley
            echo "$MOVE_B64" | base64 -d > public/sounds/foley/move.mp3
            echo "$CAPTURE_B64" | base64 -d > public/sounds/foley/capture.mp3
            echo "Foley sounds restored"
          else
            echo "Foley sound secrets not set; building without them"
          fi
      - run: npm run build && npx cap sync android && node scripts/prune-android.mjs
        env:
          VITE_NO_FULL_SINGLE: '1'
      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Build signed release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew && ./gradlew assembleRelease
          mv app/build/outputs/apk/release/app-release.apk "../DeepChess-${GITHUB_REF_NAME}.apk"
      - run: rm -f "$RUNNER_TEMP/release.jks"
        if: always()
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: DeepChess-*.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Default move sounds: third-party licence, so they live in repository secrets instead of
      # the public repo. Without the secrets the build simply uses the other sound packs.
      - name: Restore private sounds
        shell: bash
        env:
          MOVE_B64: ${{ secrets.SOUND_FOLEY_MOVE_B64 }}
          CAPTURE_B64: ${{ secrets.SOUND_FOLEY_CAPTURE_B64 }}
        run: |
          if [ -n "$MOVE_B64" ] && [ -n "$CAPTURE_B64" ]; then
            mkdir -p public/sounds/foley
            echo "$MOVE_B64" | base64 -d > public/sounds/foley/move.mp3
            echo "$CAPTURE_B64" | base64 -d > public/sounds/foley/capture.mp3
            echo "Foley sounds restored"
          else
            echo "Foley sound secrets not set; building without them"
          fi
      - run: npm run desktop:win
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: release/*.exe

  release:
    needs: [android, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Checksums
        run: cd out && sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
