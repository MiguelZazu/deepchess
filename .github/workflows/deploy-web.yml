name: Deploy web (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # https://<user>.github.io/<repo>/ needs BASE=/<repo>/; a <user>.github.io repo is served at /.
      - name: Build
        run: |
          REPO="${{ github.event.repository.name }}"
          if [[ "$REPO" == *.github.io ]]; then export BASE=/; else export BASE="/$REPO/"; fi
          npm run build
          cp dist/index.html dist/404.html
          # GitHub Pages can't send the COOP/COEP headers that multi-threaded WASM needs, so the
          # app always loads the single-threaded engines there: drop the threaded builds (~100 MB).
          rm -f dist/engine/stockfish-19.js dist/engine/stockfish-19.wasm dist/engine/stockfish-19-lite.js dist/engine/stockfish-19-lite.wasm
          du -sh dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1800000
