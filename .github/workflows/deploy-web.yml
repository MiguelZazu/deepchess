name: Deploy web (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # https://<user>.github.io/<repo>/ needs BASE=/<repo>/; a <user>.github.io repo is served at /.
      - name: Build
        run: |
          REPO="${{ github.event.repository.name }}"
          if [[ "$REPO" == *.github.io ]]; then export BASE=/; else export BASE="/$REPO/"; fi
          # The service worker (src/sw.ts) makes the site cross-origin isolated, so the
          # multi-threaded engines run. The single-threaded full engine (~95 MB) is left out; where
          # isolation is unavailable (Safari) the app falls back to Lite.
          export VITE_NO_FULL_SINGLE=1
          npm run build
          rm -f dist/engine/stockfish-19-single.js dist/engine/stockfish-19-single.wasm
          cp dist/index.html dist/404.html
          du -sh dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1800000
